schema: spec-driven

context: |
  CONTRIBUTING.md is the source of truth for project rules; this context summarises it for agents.
  Language: English
  All artifacts must be written in English.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Product: Salt Player, a minimalist desktop torrent and video player (Electron 27, React 18,
  TypeScript, WebTorrent 2, ffmpeg/ffprobe). Strict main/renderer split: src/main (Node),
  src/renderer (React, no Node access), src/shared (types, IPC channel names). The only
  bridge is src/main/preload.ts. The phone remote is an HTTP server in src/main/remote-control
  that serves one self-contained page (remote-page.ts) under a nonce-only CSP.

  Backlog lives in GitHub Issues (knrerikh/saltplayer); a change names its issue. One branch
  and one PR per change, from a fresh origin/master (feat/<N>-… or fix/<N>-…).

  Conventions:
  - TDD with Vitest (happy-dom for the renderer); tests first, and a test must fail without
    the fix. Node's http.request in HTTP tests, not fetch. Tests must pass on macOS, Linux
    and Windows (no hard-coded POSIX paths). Temp dirs must not be named saltplayer-*.
  - Verification: npx tsc --noEmit -p . and npx vitest run, with no "Errors" line.
  - Behaviour that depends on real Electron/Chromium (fullscreen, layout, keys, protocols,
    packaging) needs explicit manual-check steps.
  - Every change updates the docs it touches (README, docs/*.md, CONTRIBUTING) and adds a
    CHANGELOG entry under [Unreleased]; never bump the version in a change.
  - Senior-quality code: small named functions, comments only for "why", no dead code.
  - No attribution in commits or PRs (no Co-Authored-By, no generated-with lines).
  - Conventional Commits (feat:, fix:, docs:, chore:, refactor:, test:); the body says why.
    The PR body ends with `Fixes #N`.
  - Untrusted input (phone requests, links from websites, torrent and file names) is
    validated where it enters and rendered with textContent only.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
