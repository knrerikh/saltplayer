name: Release

# Publishes the version in package.json when it has no tag yet, which happens when
# a release PR from prepare-release.yml is merged. Other pushes to master skip every
# job. Run it by hand to rebuild and re-upload the current version's installers.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether to publish
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = push ] && git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "v$version is already released; nothing to publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create the tag and a draft release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$tag" -m "Salt Player $VERSION"
            git push origin "$tag"
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            node scripts/release/notes.mjs "$VERSION" > notes.md
            gh release create "$tag" --draft --verify-tag --title "Salt Player $VERSION" --notes-file notes.md
          fi

  test:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint --if-present

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        run: npm run test:integration

  publish:
    needs: [prepare, test]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
            arch: arm64
          - os: macos-latest
            arch: x64
          - os: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ffmpeg-static downloads a single binary for the host arch during postinstall.
      # When cross-compiling x64 DMG on a macos-latest (ARM64) runner, the bundled binary
      # would be ARM64 and crash with EBADARCH on Intel Macs. Re-download for the target arch.
      - name: Force x64 ffmpeg binary (macOS x64 cross-compile)
        if: matrix.os == 'macos-latest' && matrix.arch == 'x64'
        working-directory: node_modules/ffmpeg-static
        env:
          npm_config_platform: darwin
          npm_config_arch: x64
        run: |
          rm -f ffmpeg
          node install.js
          file ffmpeg

      - name: Rebuild native modules for Electron
        run: npx @electron/rebuild --force ${{ matrix.arch && format('--arch {0}', matrix.arch) || '' }}

      - name: Build application
        run: npm run build

      - name: Package and publish
        run: npm run package -- --publish always ${{ matrix.arch && format('--{0}', matrix.arch) || '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

  # Installers are uploaded to the draft by electron-builder; publish it only when
  # every platform succeeded, so nobody sees a release with missing downloads.
  finalize:
    needs: [prepare, publish]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
